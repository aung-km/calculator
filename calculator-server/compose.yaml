services:
  backend:
    build: .
    ports:
      - "34242:5000"
    volumes:
      - ./app:/app/app
    environment:
      DATABASE_URL: mysql+mysqlconnector://appuser:classroom-app@database:3306/appdb
    depends_on:
      database:
        condition: service_healthy

  database:
    image: mysql:8.4
    ports:
      - "127.0.0.1:54242:3306"
    environment:
      MYSQL_ROOT_PASSWORD: classroom-root
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: classroom-app
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysql --protocol=TCP --host=127.0.0.1 --user=$$MYSQL_USER --password=$$MYSQL_PASSWORD --database=$$MYSQL_DATABASE --execute='SELECT 1'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  dbdata:
